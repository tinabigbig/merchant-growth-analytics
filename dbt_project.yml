name: merchant_growth
version: "1.0.0"
profile: merchant_growth
model-paths: ["models"]
test-paths: ["tests"]
vars:
  raw_path: "data/raw"
  window_start: "2017-01-01"   # earlier months are too thin (about 330 orders in 2016)
  window_end: "2018-08-31"     # Sep to Oct 2018 has only 20 orders
models:
  merchant_growth:
    staging: {+materialized: view}
    intermediate: {+materialized: table}
    marts: {+materialized: table}
