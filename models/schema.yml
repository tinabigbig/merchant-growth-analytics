version: 2
models:
  - name: stg_orders
    description: One row per order.
    columns:
      - name: order_id
        data_tests: [unique, not_null]
      - name: order_status
        data_tests:
          - accepted_values:
              arguments:
                values: [delivered, shipped, canceled, unavailable, invoiced, processing, created, approved]
  - name: stg_customers
    description: One row per customer_id (issued per order). customer_unique_id is the person.
    columns:
      - name: customer_id
        data_tests: [unique, not_null]
      - name: customer_unique_id
        data_tests: [not_null]
  - name: stg_sellers
    columns:
      - name: seller_id
        data_tests: [unique, not_null]
  - name: stg_products
    columns:
      - name: product_id
        data_tests: [unique, not_null]
  - name: stg_order_items
    columns:
      - name: order_id
        data_tests:
          - relationships:
              arguments: {to: ref('stg_orders'), field: order_id}
      - name: seller_id
        data_tests:
          - relationships:
              arguments: {to: ref('stg_sellers'), field: seller_id}
      - name: product_id
        data_tests:
          - relationships:
              arguments: {to: ref('stg_products'), field: product_id}
  - name: int_order_reviews
    description: One review per order, the most recent answer.
    columns:
      - name: order_id
        data_tests: [unique, not_null]
      - name: review_score
        data_tests:
          - accepted_values:
              arguments: {values: [1, 2, 3, 4, 5]}
  - name: fct_orders
    description: One row per order with order-experience measures.
    columns:
      - name: order_id
        data_tests: [unique, not_null]
      - name: customer_unique_id
        data_tests: [not_null]
  - name: dim_sellers
    description: One row per seller.
    columns:
      - name: seller_id
        data_tests: [unique, not_null]
